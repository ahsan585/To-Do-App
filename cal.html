<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A sleek, modern glassmorphic web calculator with real-time expression history, keyboard shortcuts, and sound effects.">
    <title>Modern Glassmorphic Calculator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cal.css">
</head>
<body class="main">
    <main class="calculator-wrapper">
        <!-- Ambient decorative glow blobs -->
        <div class="ambient-glow glow-top"></div>
        <div class="ambient-glow glow-bottom"></div>

        <div class="calculator" role="region" aria-label="Calculator">
            <!-- Header bar with title & sound toggle -->
            <header class="calculator-header">
                <div class="window-dots" aria-hidden="true">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-yellow"></span>
                    <span class="dot dot-green"></span>
                </div>
                <h1 class="brand-title">CALC<span class="highlight">PRO</span></h1>
                <button type="button" id="soundToggle" class="icon-btn" aria-label="Toggle sound effects" title="Toggle Sound">
                    <svg id="soundIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                </button>
            </header>

            <!-- Dual-tier Display Area -->
            <section class="display-container" aria-live="polite">
                <div id="historyDisplay" class="history-display" aria-label="Expression history"></div>
                <div class="primary-display-wrapper">
                    <input type="text" id="primaryDisplay" class="primary-display" value="0" readonly aria-label="Current value">
                </div>
            </section>

            <!-- 5x4 Keypad Grid -->
            <section class="keypad" role="group" aria-label="Calculator keypad">
                <!-- Row 1 -->
                <button type="button" class="btn btn-action" data-action="clear" data-key="Escape" title="Clear All (Esc)">AC</button>
                <button type="button" class="btn btn-action" data-action="delete" data-key="Backspace" title="Backspace (Del)">DEL</button>
                <button type="button" class="btn btn-action" data-action="percent" data-key="%" title="Percent (%)">%</button>
                <button type="button" class="btn btn-operator" data-action="operator" data-value="/" data-key="/" title="Divide (/)">÷</button>

                <!-- Row 2 -->
                <button type="button" class="btn btn-num" data-action="number" data-value="7" data-key="7">7</button>
                <button type="button" class="btn btn-num" data-action="number" data-value="8" data-key="8">8</button>
                <button type="button" class="btn btn-num" data-action="number" data-value="9" data-key="9">9</button>
                <button type="button" class="btn btn-operator" data-action="operator" data-value="*" data-key="*" title="Multiply (*)">×</button>

                <!-- Row 3 -->
                <button type="button" class="btn btn-num" data-action="number" data-value="4" data-key="4">4</button>
                <button type="button" class="btn btn-num" data-action="number" data-value="5" data-key="5">5</button>
                <button type="button" class="btn btn-num" data-action="number" data-value="6" data-key="6">6</button>
                <button type="button" class="btn btn-operator" data-action="operator" data-value="-" data-key="-" title="Subtract (-)">−</button>

                <!-- Row 4 -->
                <button type="button" class="btn btn-num" data-action="number" data-value="1" data-key="1">1</button>
                <button type="button" class="btn btn-num" data-action="number" data-value="2" data-key="2">2</button>
                <button type="button" class="btn btn-num" data-action="number" data-value="3" data-key="3">3</button>
                <button type="button" class="btn btn-operator" data-action="operator" data-value="+" data-key="+" title="Add (+)">+</button>

                <!-- Row 5 -->
                <button type="button" class="btn btn-num" data-action="negate" title="Positive/Negative (±)">±</button>
                <button type="button" class="btn btn-num" data-action="number" data-value="0" data-key="0">0</button>
                <button type="button" class="btn btn-num" data-action="decimal" data-value="." data-key=".">.</button>
                <button type="button" class="btn btn-equals" data-action="calculate" data-key="Enter" title="Calculate (Enter)">=</button>
            </section>

            <!-- Keyboard shortcut hint footer -->
            <footer class="calculator-footer">
                <span>Keyboard enabled • [Enter] = • [Esc] Clear</span>
            </footer>
        </div>
    </main>

    <script src="cal.js"></script>
</body>
</html>
